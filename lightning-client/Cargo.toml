[package]
name = "lightning-client"
version = "1.0.0"
edition = "2021"
description = "Shared models, monetary types, configuration and validation for Lightning Driver nodes."
license = "MIT"
license-file = "../LICENSE"
repository = "https://github.com/jfrader/lightning-driver"
readme = "../README.md"
keywords = ["lightning", "bitcoin", "configuration", "validation"]
categories = ["cryptography::cryptocurrencies", "config"]
rust-version = "1.89"

[package.metadata.docs.rs]
all-features = true

[dependencies]
config      = { workspace = true }
serde       = { workspace = true }
chrono        = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
bitcoin = "0.32"
lightning-invoice = "=0.34.1"
libc = "0.2"
rustix = { version = "1", features = ["process"] }
ipnet = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
