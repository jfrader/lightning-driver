name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

permissions: {}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Update only by reviewing the upstream release and replacing the full SHA and version together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Toolchain prerequisites
        run: |
          rustc --version
          command -v protoc >/dev/null || (sudo apt-get update && sudo apt-get install -y protobuf-compiler)
          protoc --version
          pkg-config --modversion openssl
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      # https://crates.io/docs/trusted-publishing
      # Bootstrap once from the release checkout: use a crates.io API token with
      # cargo login, then cargo publish -p lightning-client and cargo publish -p api-server.
      # Each crate must exist before configuring Settings > Trusted Publishing:
      # owner jfrader, repository lightning-driver, workflow release.yml, no environment.
      # Later version tags (or dispatches on those tags) publish both crates and create the release.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish shared client
        run: cargo publish -p lightning-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish API server
        run: cargo publish -p api-server
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
