name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  backend:
    runs-on: [self-hosted, mifulbo-ci]
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain prerequisites
        run: |
          rustc --version
          protoc --version
          pkg-config --modversion openssl
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Client without default features
        run: cargo check -p lightning-client --no-default-features
      - name: Workspace with all features
        run: cargo check --workspace --all-features
