[package]
name = "synthetic-node-harness"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
synthetic-dev = []

[[bin]]
name = "synthetic-node-harness"
required-features = ["synthetic-dev"]

[dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
lightning-client = { path = "../lightning-client" }
hyper = { version = "0.14", features = ["server", "http1", "http2", "stream"] }
tokio-rustls = "0.24"
tempfile = "3"
lnd_grpc_rust = "=2.12.0"
bitcoin = "0.32"
lightning-invoice = "=0.34.1"
hex = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
reqwest = { workspace = true }
