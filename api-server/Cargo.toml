[package]
name = "lightning-driver-api"
version = "1.0.0"
edition = "2021"
description = "HTTP API with operator authentication, policy enforcement and a durable journal for Lightning and Bitcoin nodes"
license = "MIT"
repository = "https://github.com/jfrader/lightning-driver"
readme = "../README.md"
keywords = ["lightning", "bitcoin", "lnd", "cln", "http-api"]
categories = ["cryptography::cryptocurrencies", "web-programming::http-server"]
rust-version = "1.89"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "api_server"

[[bin]]
name = "api-server"
path = "src/main.rs"

[dependencies]
actix-web = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

lightning-client = { path = "../lightning-client", version = "1.0.0" }
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
hex = { workspace = true }
libc = "0.2"
rustix = { version = "1", features = ["process"] }
webauthn-rs = "=0.5.5"
url = { workspace = true }
bitcoin = "0.32"
secp256k1 = "0.29"
bech32 = "0.11"
lightning-invoice = "=0.34.1"
reqwest = { workspace = true }
base64 = { workspace = true }
lnd_grpc_rust = "=2.12.0"
tonic = { version = "0.7", features = ["tls"] }
http-body = "0.4"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pemfile = "1"
tokio-rustls = "0.24"
x509-parser = "0.16"
tempfile = "3"

[dev-dependencies]
synthetic-node-harness = { path = "../synthetic-node-harness", features = ["synthetic-dev"] }
hyper = { version = "0.14", features = ["server", "http1", "http2", "stream"] }
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
