[package]
name = "api-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

lightning-client = { path = "../lightning-client", features = ["lnd-grpc", "cln"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
chrono = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
hex = { workspace = true }
libc = "0.2"
rustix = { version = "1", features = ["process"] }
webauthn-rs = "=0.5.5"
url = { workspace = true }
bitcoin = "0.32"
lightning-invoice = "=0.34.1"
reqwest = { workspace = true }
base64 = { workspace = true }
lnd_grpc_rust = "=2.12.0"
tonic = { version = "0.7", features = ["tls"] }
http-body = "0.4"

[dev-dependencies]
hyper = { version = "0.14", features = ["server", "http1", "http2", "stream"] }
tokio-rustls = "0.24"
tempfile = "3"
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
